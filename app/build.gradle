// App module build file. Applies the Android + Kotlin + Firebase plugins and declares dependencies.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Must be applied AFTER the Android plugin so it can hook into the build.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.chefshare.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chefshare.app"
        minSdk 24            // Covers ~98% of active devices while allowing modern APIs.
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            // Kept off for this academic build so the debug/release behaviour is identical
            // and the student can reason about the code without shrinker surprises.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // ViewBinding gives us type-safe view access (no findViewById, no crashes from bad casts).
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // --- AndroidX core & UI ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Backports the Android 12 splash screen API to older versions.
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // --- MVVM: Lifecycle, ViewModel, LiveData ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // --- Coroutines: lets us `.await()` Firebase Tasks for clean, linear repository code ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // --- Firebase (the BoM keeps all Firebase library versions mutually compatible) ---
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'        // Email/Password authentication
    implementation 'com.google.firebase:firebase-firestore-ktx'   // Cloud Firestore (recipes)
    implementation 'com.google.firebase:firebase-storage-ktx'     // Cloud Storage (recipe images)

    // --- Glide: image loading & caching for recipe photos ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
